<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350">
<rect width="880" height="350" fill="#f8fafc"/>
<text x="40" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">Multi-input image classification prototype</text>
<text x="40" y="65" font-family="Arial" font-size="13" fill="#475569">Educational architecture — not end-to-end OCR</text>
<g font-family="Arial" font-size="15" text-anchor="middle">
<rect x="40" y="98" width="145" height="76" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text x="112" y="131">Image input</text><text x="112" y="152">1 × 64 × 64</text>
<rect x="235" y="98" width="155" height="76" rx="12" fill="#bfdbfe" stroke="#60a5fa"/><text x="312" y="129">image_layer</text><text x="312" y="149">CNN + FC → 128</text>
<rect x="40" y="220" width="145" height="76" rx="12" fill="#dcfce7" stroke="#4ade80"/><text x="112" y="250">Type input</text><text x="112" y="271">one-hot (5)</text>
<rect x="235" y="220" width="155" height="76" rx="12" fill="#bbf7d0" stroke="#4ade80"/><text x="312" y="252">type_layer</text><text x="312" y="272">Linear → 32</text>
<rect x="470" y="146" width="140" height="92" rx="12" fill="#fef3c7" stroke="#f59e0b"/><text x="540" y="181">Concatenate</text><text x="540" y="204">160 features</text>
<rect x="682" y="146" width="160" height="92" rx="12" fill="#ede9fe" stroke="#a78bfa"/><text x="762" y="181">Classifier</text><text x="762" y="204">4 category logits</text>
</g>
<g fill="none" stroke="#64748b" stroke-width="3"><path d="M185 136H235"/><path d="M185 258H235"/><path d="M390 136H425V171H470"/><path d="M390 258H425V216H470"/><path d="M610 192H682"/></g>
</svg>
